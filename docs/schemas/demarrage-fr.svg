" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="216" y="145" font-size="20" font-weight="400" fill="#8a90a2" text-anchor="middle">⬇</text><text x="140" y="186" font-size="15.5" font-weight="650" fill="#1d2333" text-anchor="middle">Télécharger</text><text x="140" y="207.0" font-size="12.5" font-weight="400" fill="#5b6275" text-anchor="middle">Prisme.exe, .app</text><text x="140" y="224.5" font-size="12.5" font-weight="400" fill="#5b6275" text-anchor="middle">ou Linux : 11 Mo</text><line x1="242" y1="168" x2="270" y2="168" stroke="#5b5bf0" stroke-width="2.2" marker-end="url(#pointe-5b5bf0)"/><rect x="272" y="104" width="200" height="128" rx="14" fill="#fff" stroke="#dfe2ea" stroke-width="1.5" filter="url(#ombre)"/><circle cx="306" cy="138" r="17" fill="#5b5bf0"/><text x="306" y="144" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="448" y="145" font-size="20" font-weight="400" fill="#8a90a2" text-anchor="middle">⚙</text><text x="372" y="186" font-size="15.5" font-weight="650" fill="#1d2333" text-anchor="middle">Installer le moteur</text><text x="372" y="207.0" font-size="12.5" font-weight="400" fill="#5b6275" text-anchor="middle">un clic, une seule fois</text><line x1="474" y1="168" x2="502" y2="168" stroke="#5b5bf0" stroke-width="2.2" marker-end="url(#pointe-5b5bf0)"/><rect x="504" y="104" width="200" height="128" rx="14" fill="#fff" stroke="#dfe2ea" stroke-width="1.5" filter="url(#ombre)"/><circle cx="538" cy="138" r="17" fill="#5b5bf0"/><text x="538" y="144" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="680" y="145" font-size="20" font-weight="400" fill="#8a90a2" text-anchor="middle">▣</text><text x="604" y="186" font-size="15.5" font-weight="650" fill="#1d2333" text-anchor="middle">Choisir ta machine</text><text x="604" y="207.0" font-size="12.5" font-weight="400" fill="#5b6275" text-anchor="middle">le profil conseillé</text><text x="604" y="224.5" font-size="12.5" font-weight="400" fill="#5b6275" text-anchor="middle">est déjà marqué</text><line x1="706" y1="168" x2="734" y2="168" stroke="#5b5bf0" stroke-width="2.2" marker-end="url(#pointe-5b5bf0)"/><rect x="736" y="104" width="200" height="128" rx="14" fill="#fff" stroke="#dfe2ea" stroke-width="1.5" filter="url(#ombre)"/><circle cx="770" cy="138" r="17" fill="#5b5bf0"/><text x="770" y="144" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="912" y="145" font-size="20" font-weight="400" fill="#8a90a2" text-anchor="middle">✎</text><text x="836" y="186" font-size="15.5" font-weight="650" fill="#1d2333" text-anchor="middle">Décrire l’image</text><text x="836" y="207.0" font-size="12.5" font-weight="400" fill="#5b6275" text-anchor="middle">puis la modifier</text><text x="836" y="224.5" font-size="12.5" font-weight="400" fill="#5b6275" text-anchor="middle">en une phrase</text><text x="490" y="262" font-size="13" font-weight="600" fill="#8a90a2" text-anchor="middle">ou bien</text><rect x="110" y="276" width="760" height="40" rx="12" fill="#e8f7ef" stroke="#bfe8d2" stroke-width="1.5" filter="url(#ombre)"/><text x="490" y="301" font-size="13.5" font-weight="600" fill="#1f9d63" text-anchor="middle">✳  Connecter à Claude, puis lui demander : « installe Prisme et crée-moi une image »</text></svg>

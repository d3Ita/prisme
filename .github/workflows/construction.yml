name: Construction

# Construit Prisme, verifie que chaque programme demarre, puis garde les fichiers
# comme artefacts (ils ne sont pas publies automatiquement).
# Windows et Linux a chaque envoi ; macOS seulement en lancement manuel (Actions → Construction → Run workflow),
# car les machines Mac de GitHub sont souvent indisponibles
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construire:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            programme: Prisme.exe
            fichier: Prisme.exe
          - os: ubuntu-24.04
            programme: .construction/dist/prisme
            fichier: dist/Prisme-Linux-x64.tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Outils de construction
        run: python -m pip install pyinstaller pillow
      - name: Construction
        run: python construire.py
      - name: Essai du programme
        env:
          PRISME_RACINE: ${{ runner.temp }}/prisme-essai
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/essai_programme.py ${{ matrix.programme }}
      - uses: actions/upload-artifact@v4
        with:
          name: Prisme-${{ runner.os }}
          path: ${{ matrix.fichier }}
          if-no-files-found: error

  construire-mac:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Outils de construction
        run: python -m pip install pyinstaller pillow
      - name: Construction
        run: python construire.py
      - name: Essai du programme
        env:
          PRISME_RACINE: ${{ runner.temp }}/prisme-essai
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/essai_programme.py .construction/dist/Prisme.app/Contents/MacOS/Prisme
      - uses: actions/upload-artifact@v4
        with:
          name: Prisme-macOS
          path: |
            dist/Prisme-macOS-arm64.dmg
            dist/Prisme-macOS-arm64.zip
          if-no-files-found: error

  # Prisme 2 : captures de la fenetre Qt Quick avec de fausses images (artefact Apercu-Qt), a regarder sans rien installer
  apercu-qt:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Ecran virtuel et bibliotheques de Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 fonts-inter
      - name: PySide6
        run: python -m pip install PySide6==6.8.1
      - name: Captures
        run: xvfb-run -a -s "-screen 0 1600x1000x24" python .github/scripts/apercu_qt.py captures
      - uses: actions/upload-artifact@v4
        with:
          name: Apercu-Qt
          path: captures/
          if-no-files-found: error

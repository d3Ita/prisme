<svg xmlns="http://www.w3.org/2000/svg" width="980" height="406" viewBox="0 0 980 406" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica Neue, Arial, sans-serif" role="img" aria-label="Prisme avec Claude"><title>Prisme avec Claude</title><defs><marker id="pointe-8a90a2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a90a2"/></marker><marker id="pointe-c26a12" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c26a12"/></marker><marker id="pointe-5b5bf0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5b5bf0"/></marker><marker id="pointe-1f9d63" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f9d63"/></marker><filter id="ombre" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1d2333" flood-opacity=".08"/></filter><linearGradient id="verre" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7a7cff"/><stop offset="1" stop-color="#3a2d8f"/></linearGradient><linearGradient id="fond" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbfbfe"/><stop offset="1" stop-color="#f3f4f9"/></linearGradient></defs><rect width="980" height="406" rx="20" fill="url(#fond)" stroke="#dfe2ea"/><text x="40" y="52" font-size="24" font-weight="700" fill="#1d2333" text-anchor="start">Prisme avec Claude</text><text x="40" y="78" font-size="14.5" font-weight="400" fill="#5b6275" text-anchor="start">Un clic sur « Connecter à Claude », puis il suffit de demander</text><rect x="40" y="108" width="240" height="116" rx="16" fill="#fff" stroke="#dfe2ea" stroke-width="1.5" filter="url(#ombre)"/><circle cx="160" cy="132" r="8" fill="#5b5bf0"/><path d="M146 152 a14 12 0 0 1 28 0 z" fill="#5b5bf0"/><text x="160" y="172" font-size="16" font-weight="650" fill="#1d2333" text-anchor="middle">Toi</text><text x="160" y="193.0" font-size="12.5" font-weight="400" fill="#5b6275" text-anchor="middle">« Crée l’image</text><text x="160" y="210.5" font-size="12.5" font-weight="400" fill="#5b6275" text-anchor="middle">d’un phare à l’aube »</text><rect x="370" y="108" width="240" height="116" rx="16" fill="#fff" stroke="#dfe2ea" stroke-width="1.5" filter="url(#ombre)"/><text x="490" y="148" font-size="24" font-weight="700" fill="#d97757" text-anchor="middle">✳</text><text x="490" y="172" font-size="16" font-weight="650" fill="#1d2333" text-anchor="middle">Claude</text><text x="490" y="193.0" font-size="12.5" font-weight="400" fill="#5b6275" text-anchor="middle">choisit l’outil Prisme</text><text x="490" y="210.5" font-size="12.5" font-weight="400" fill="#5b6275" text-anchor="middle">et attend l’image</text><rect x="700" y="108" width="240" height="116" rx="16" fill="#eef0ff" stroke="#c7ccff" stroke-width="1.5" filter="url(#ombre)"/><g transform="translate(807.0,123.0)"><line x1="-9.1" y1="16.12" x2="9.36" y2="13.0" stroke="#fff" stroke-width="2.4" opacity=".9"/><path d="M13.0 0 L26 26 L0 26 Z" fill="url(#verre)" stroke="#fff" stroke-width="1.6"/><line x1="17.16" y1="13.0" x2="37.699999999999996" y2="9.88" stroke="#ff5a5a" stroke-width="2.4"/><line x1="17.16" y1="13.0" x2="37.699999999999996" y2="11.700000000000001" stroke="#ffb13d" stroke-width="2.4"/><line x1="17.16" y1="13.0" x2="37.699999999999996" y2="13.52" stroke="#ffe14d" stroke-width="2.4"/><line x1="17.16" y1="13.0" x2="37.699999999999996" y2="15.340000000000002" stroke="#4cd97b" stroke-width="2.4"/><line x1="17.16" y1="13.0" x2="37.699999999999996" y2="17.16" stroke="#4aa8ff" stroke-width="2.4"/><line x1="17.16" y1="13.0" x2="37.699999999999996" y2="18.98" stroke="#8a6bff" stroke-width="2.4"/></g><text x="820" y="178" font-size="16" font-weight="700" fill="#5b5bf0" text-anchor="middle">Prisme</text><text x="820" y="198.0" font-size="12.5" font-weight="400" fill="#5b6275" text-anchor="middle">crée l’image sur</text><text x="820" y="215.5" font-size="12.5" font-weight="400" fill="#5b6275" text-anchor="middle">ta carte graphique</text><line x1="282" y1="150" x2="368" y2="150" stroke="#5b5bf0" stroke-width="2.2" marker-end="url(#pointe-5b5bf0)"/><text x="325.0" y="142.0" font-size="12" font-weight="500" fill="#5b6275" text-anchor="middle">demande</text><line x1="612" y1="150" x2="698" y2="150" stroke="#5b5bf0" stroke-width="2.2" marker-end="url(#pointe-5b5bf0)"/><text x="655.0" y="142.0" font-size="12" font-weight="500" fill="#5b6275" text-anchor="middle">outil MCP</text><path d="M820 226 C 820 256, 160 256, 160 230" fill="none" stroke="#1f9d63" stroke-width="2.2" marker-end="url(#pointe-1f9d63)"/><text x="490" y="278" font-size="13" font-weight="600" fill="#1f9d63" text-anchor="middle">l’image revient dans la conversation</text><rect x="40" y="298" width="900" height="88" rx="14" fill="#fff3e4" stroke="#f3d2a8" stroke-width="1.5" filter="url(#ombre)"/><text x="490" y="326" font-size="14.5" font-weight="650" fill="#c26a12" text-anchor="middle">Licence non commerciale ou modèle hors catalogue ?</text><text x="490" y="348" font-size="13" font-weight="400" fill="#1d2333" text-anchor="middle">Prisme t’affiche la licence ou un avertissement dans sa fenêtre :</text><text x="490" y="367" font-size="13" font-weight="400" fill="#1d2333" text-anchor="middle">seul ton clic lance le téléchargement, jamais Claude.</text></svg>

name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    # macOS n'est pas teste a chaque envoi : les machines Mac de GitHub sont souvent indisponibles
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Tests du serveur et du serveur MCP
        run: python -m unittest discover -s tests -v
      # Le serveur MCP integre (bibliotheque standard) avec le client MCP officiel, comme Claude
      - name: Serveur MCP avec le client MCP officiel
        run: |
          python -m pip install mcp
          python -m unittest tests.test_protocole_mcp -v
      # Prisme 2 : la fenetre Qt Quick (PySide6), chargee sans ecran
      - name: Bibliotheques de Qt sous Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1
      - name: Fenetre Qt Quick
        run: |
          python -m pip install PySide6==6.8.1
          python -m unittest tests.test_qt -v
